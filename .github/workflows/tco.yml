name: Actualizar TCO
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 23:30 en La Paz (UTC-4), todos los días
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pandas
      - run: python tco_scraper.py
      - run: |
          git config user.name "tco-bot"
          git config user.email "tco-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Actualiza TCO $(date -u +%F)" && git push)
